# SideraGuard Trigger — wakes SideraGuard as soon as a maintainer approves.
#
# See docs/SIDERAGUARD.md.
#
# A `pull_request_review` run only gets a read-only token on fork PRs, so it
# cannot merge. This workflow therefore does nothing but finish; SideraGuard
# listens for it via `workflow_run` and does the real work from the default
# branch with its own permissions. It has no permissions and runs no PR code.

name: SideraGuard Trigger

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  ping:
    name: Approval received
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      # Quoted so the "#" is not read as the start of a YAML comment.
      - run: 'echo "Approval on PR #${PR}; SideraGuard will sweep open pull requests."'
        env:
          PR: ${{ github.event.pull_request.number }}
