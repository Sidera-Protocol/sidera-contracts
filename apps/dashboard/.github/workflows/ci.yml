name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block auto-run configs, binary payloads and npm lifecycle hooks
        run: bash scripts/check-repo-hygiene.sh
      - name: SideraGuard scanner regression tests
        run: bash scripts/sideraguard/test-scan.sh
      - name: SideraReview regression tests
        run: bash scripts/siderareview/test-review.sh

  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Typecheck (npm run lint = tsc --noEmit) must pass before build.
      - run: npm run lint
      - run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/standalone
          if-no-files-found: ignore
