[package]
name         = "sidera-registry"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
description   = "Sidera name registry — human-readable payment names for Stellar"
build         = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Property-based tests: randomized invariants for the fund-loss bug
# classes (bad names, altered memos, ownership races). Cases are
# deterministic by default; override with PROPTEST_CASES=n.
proptest = "1"

[lints]
workspace = true
