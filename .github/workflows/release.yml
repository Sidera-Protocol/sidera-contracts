name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build WASM Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      # SDK 27 builds with plain cargo (no stellar-cli needed); this is the
      # same build the CI `WASM Build` gate runs, so a released artifact is
      # byte-for-byte the configuration CI approved.
      - name: Build registry to WASM
        run: cargo build --locked --release --target wasm32v1-none -p sidera-registry
      - name: Collect artifacts and checksums
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          found=0
          for wasm in target/wasm32v1-none/release/*.wasm; do
            cp "$wasm" artifacts/
            sha256sum "$wasm" >> artifacts/SHA256SUMS
            echo "Built $(basename "$wasm")"
            found=1
          done
          if [[ "$found" -eq 0 ]]; then
            echo "::error::no WASM artifacts produced — release aborted"
            exit 1
          fi
      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sidera-wasm-${{ github.ref_name }}
          path: artifacts/*
          retention-days: 90
          compression-level: 9

  release:
    name: GitHub Release (draft)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
